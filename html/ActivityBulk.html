<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadets Management System</title>
  </head>
  <body>
    <h1>Bulk Activity Planner</h1>
    <form action="submit" method="post">
      <label>Activity Name:</label>
      <input type="text" id="activity_name" name="activity_name" required />
      <br /><br />
      <label>Course Name:</label>
      <select>
        <option>Select</option>
        <option>Basic Course</option>
        <option>PTF Course</option>
      </select>
      <br /><br />
      <label>Module:</label>
      <select>
        <option>Select</option>
        <option>CADRE</option>
        <option>PLSP</option>
        <option>MFR</option>
      </select>
      <br /><br />
      <label>Skill:</label>
      <select>
        <option>Select</option>
        <option>CADRE</option>
        <option>PLSP</option>
        <option>MFR</option>
      </select>
      <br /><br />

      <label>Sub-Skill:</label>
      <select>
        <option>Select</option>
        <option>Hand Only CPR</option>
        <option>Bleeding Control</option>
        <option>Recovery Position</option>
      </select>

      
    </form>
  </body>
</html>
